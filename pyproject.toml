[project]
name = "sensei"
version = "0.2.0"
description = "Transform documentation into interactive, project-based learning"
readme = "README.md"
authors = [
    { name = "kuldeepguptahub", email = "kuldeep.gupta2603@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "tomli-w>=1.2.0",
    "typer>=0.27.0",
    "httpx>=0.27.0",
    "tomli>=2.4.1",
    "pytest>=9.1.1",
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[project.scripts]
sensei = "sensei.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
